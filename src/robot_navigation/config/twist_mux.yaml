twist_mux:
  ros__parameters:
    use_stamped: true
    topics:
      navigation:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 10
      manual:
        topic: cmd_vel_manual
        timeout: 0.5   # backstop; the dead-man zero is injected by safety_supervisor at 0.4 s
        priority: 100
    locks:
      estop:
        topic: /robot/safety/mux_lock
        timeout: 0.0
        priority: 255
